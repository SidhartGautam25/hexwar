name: Build Android Debug APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
      - dev
      - tutorial-test

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # =========================================================
      # FREE DISK SPACE
      # IMPORTANT: DO NOT DELETE THE ANDROID SDK
      # =========================================================
      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "Disk space after cleanup:"
          df -h

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # SETUP NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      # =========================================================
      # SETUP JAVA
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # SETUP GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # VERIFY ANDROID SDK
      # =========================================================
      - name: Verify Android SDK
        run: |
          echo "=========================================="
          echo "ANDROID SDK CONFIGURATION"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK was not found at:"
            echo "$ANDROID_HOME"
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "WARNING: Android platform-tools directory not found."
          fi

          echo "Android SDK directory exists."

          echo ""
          echo "Available SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Available SDK build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # =========================================================
      # INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install Dependencies
        working-directory: android
        run: npm ci --prefer-offline

      # =========================================================
      # GENERATE NATIVE ANDROID PROJECT
      # =========================================================
      - name: Prebuild Native Folders
        working-directory: android
        run: npx expo prebuild --platform android --no-install

      # =========================================================
      # CONFIGURE ANDROID SDK FOR GRADLE
      # =========================================================
      - name: Configure Android SDK for Gradle
        working-directory: android/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Generated local.properties:"
          cat local.properties

      # =========================================================
      # BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: android/android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
            -Dorg.gradle.workers.max=4
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true

        run: |
          chmod +x gradlew

          echo "=========================================="
          echo "BUILDING ANDROID DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=4 \
            --build-cache

          echo ""
          echo "=========================================="
          echo "DEBUG APK BUILD COMPLETED"
          echo "=========================================="

          ls -lh app/build/outputs/apk/debug/

      # =========================================================
      # UPLOAD DEBUG APK
      # =========================================================
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7